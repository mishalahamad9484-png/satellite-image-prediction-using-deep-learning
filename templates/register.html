<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Orbital AI Register</title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css?family=Poppins:200,300,400,600,700,800"
          rel="stylesheet">

    <!-- BLACK DASHBOARD CSS -->

    <link href="{{ url_for('static', filename='assets/css/black-dashboard.css') }}"
          rel="stylesheet"/>

    <!-- NUCLEO ICONS -->

    <link href="{{ url_for('static', filename='assets/css/nucleo-icons.css') }}"
          rel="stylesheet"/>

    <style>

        body{

    background:
    linear-gradient(
    135deg,
    #000000 0%,
    #020617 30%,
    #050816 65%,
    #000000 100%);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    position:relative;

}
.glow{

    position:absolute;

    width:850px;

    height:850px;

    background:
    radial-gradient(circle,
    rgba(0,217,255,0.10),
    transparent 72%);

    top:-180px;

    left:50%;

    transform:translateX(-50%);

    filter:blur(90px);

}

        .register-card{

    width:470px;

    padding:45px;

    border-radius:30px;

    background:
    rgba(255,255,255,0.04);

    border:
    1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(22px);

    box-shadow:
    0 25px 70px rgba(0,0,0,0.45);

    position:relative;

    z-index:2;

}

        .register-title{

    text-align:center;

    color:white;

    font-size:42px;

    font-weight:800;

    margin-bottom:15px;

}
        .register-subtitle{

    text-align:center;

    color:#94a3b8;

    margin-bottom:35px;

    font-size:17px;

}

        .form-control{

    background:
    rgba(255,255,255,0.06) !important;

    border:
    1px solid rgba(255,255,255,0.08) !important;

    color:white !important;

    height:55px;

    border-radius:15px;

    margin-bottom:20px;

    padding-left:20px;

}

        .btn-register{

    width:100%;

    height:58px;

    border:none;

    border-radius:50px;

    background:
    linear-gradient(to right,#2563eb,#06b6d4);

    color:white;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 12px 30px rgba(37,99,235,0.25);

}

.btn-register:hover{

    transform:translateY(-4px);

}

        .btn-register:hover{

            transform:translateY(-3px);

            box-shadow:
            0 0 20px rgba(0,255,255,0.35);

        }

        .login-link{

            text-align:center;

            margin-top:25px;

            color:#9ca3af;

        }

        .login-link a{

    color:#00d9ff;

    text-decoration:none;

    font-weight:600;

}

    </style>

</head>

    <body>

<div class="glow"></div>

<div class="register-card">

    <h1 class="register-title">

        CREATE ACCOUNT

    </h1>

    <p class="register-subtitle">

        Register for Orbital AI Access

    </p>

    <!-- REGISTER FORM -->

    <form action="/register"
          method="POST">

        <input type="text"
               name="username"
               placeholder="Username"
               class="form-control"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               class="form-control"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               class="form-control"
               required>

        <button type="submit"
                class="btn-register">

            CREATE ACCOUNT

        </button>

    </form>

    <!-- LOGIN LINK -->

    <div class="login-link">

        Already have account?

        <a href="/">

            Login

        </a>

    </div>

</div>

</body>

</html>
